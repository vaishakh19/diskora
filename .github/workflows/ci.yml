name: CI

# Everything the app needs to be trustworthy is checked here.
#
# The gates, in the order a change meets them:
#
#   1. frontend         — TypeScript, the frontend test suite, the production build
#   2. licence          — the licence-lifecycle and webhook-signature contract tests
#   3. rust             — fmt, clippy, the Rust unit *and* integration tests, cargo check
#   4. migrations       — the SQL schema applies cleanly to a scratch Postgres
#   5. installers       — the real Tauri MSI + NSIS bundles, uploaded as artifacts
#   6. smoke-windows    — Windows build/link only; real NTFS scan is a manual gate
#   7. audit            — dependency and secret scanning
#
# Nothing here is allowed to pass without running. A job that cannot run on this runner is marked
# `continue-on-error` with an explicit reason in its name, never silently green.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Confirm no private key or provider secret is in the bundle
        shell: bash
        run: |
          # The frontend bundle must never contain a signing key, a provider API key or a webhook
          # secret. This greps the built output for the shapes those take.
          set -euo pipefail
          if grep -rIl --exclude='*.map' \
              -e 'BEGIN PRIVATE KEY' \
              -e 'BEGIN EC PRIVATE KEY' \
              -e 'whsec_' \
              -e 'sk_live_' \
              -e 'sk_test_' \
              -e 'service_role' \
              dist/ ; then
            echo "::error::A secret-shaped string was found in dist/. Refusing to pass."
            exit 1
          fi
          echo "No secret-shaped strings in dist/."

  licence:
    name: Licence lifecycle and webhook signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The licence fixtures are generated, so they can be regenerated and compared. A change that
      # alters the payload shape fails here rather than in a customer's hands.
      - name: Regenerate the shared licence vectors and confirm they are unchanged
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/tests/fixtures/licences.json /tmp/licences.before.json
          node scripts/make-licence-fixtures.mjs
          if ! diff -q /tmp/licences.before.json src-tauri/tests/fixtures/licences.json; then
            echo "::error::src-tauri/tests/fixtures/licences.json is stale. Run 'node scripts/make-licence-fixtures.mjs' and commit the result."
            exit 1
          fi
          echo "Licence vectors are current."

      - name: Licence lifecycle and webhook signature tests
        run: npm run test:licence

      - name: Confirm the shipped trusted key is the documented placeholder
        shell: bash
        run: |
          set -euo pipefail
          # The public key in the shipped config is an all-zero placeholder: it signs nothing, so a
          # build straight off the default branch can never mint a real entitlement. A real key here
          # would mean a matching private key exists somewhere it should not.
          python3 - <<'PYEOF'
          import base64, re, sys
          source = open('src-tauri/src/config/product.rs', encoding='utf-8').read()
          # Only the shipped configuration, not the deliberately-broken values in the unit tests,
          # which live in the `#[cfg(test)]` module further down the file.
          start = source.index('pub static DEFAULT_CONFIG')
          end = source.index('#[cfg(test)]', start)
          block = source[start:end]
          keys = re.findall(r'public_key_base64:\s*"([^"]+)"', block)
          if not keys:
              print('::error::no trusted key found in the shipped configuration')
              sys.exit(1)
          for key in keys:
              try:
                  decoded = base64.b64decode(key + '=' * (-len(key) % 4))
              except Exception:
                  print('::error::the shipped trusted key is not valid base64')
                  sys.exit(1)
              if set(decoded) != {0}:
                  print('::error::the shipped trusted key is not the documented all-zero placeholder')
                  sys.exit(1)
          print(f'All {len(keys)} shipped trusted keys are placeholders; a default-branch build mints nothing.')
          PYEOF

  rust:
    name: Rust (test, clippy, fmt)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # tauri-build reads ../dist even for cargo clippy/test; the separate frontend job's build
      # output lives on a different runner. Prepare assets here before compiling the build script.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate the Windows icon before RC.EXE runs
        working-directory: .
        run: npm run test:icons
      - name: Prepare frontend assets for the Tauri build script
        working-directory: .
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          RUST_BACKTRACE: 1
        run: |
          set -o pipefail
          # Hosted logs are not reachable in all environments; publish enough context as check
          # annotations to diagnose build-script panics as well as compiler errors. Include the
          # final non-newline-terminated line and leave ANSI coloring off for readable messages.
          if ! cargo clippy --all-targets --message-format=short -- -D warnings >clippy.log 2>&1; then
            tail -35 clippy.log | while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] || printf '::error::%s\n' "$line"
            done
            echo '::error::Clippy failed; full diagnostics are in the job log.'
            exit 1
          fi

      # Unit tests and the integration tests together: `cargo test --all` would skip the
      # `tests/` directory in some layouts, so both targets are named explicitly.
      - name: Tests
        run: cargo test --lib --tests

      - name: Licence lifecycle integration test
        run: cargo test --test licence_lifecycle -- --nocapture

      - name: Build (debug)
        run: cargo check --all-targets

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diskwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Create Supabase-like roles for RPC privilege checks
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d diskwise_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL

      - name: Apply every migration in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "==> $migration"
            psql -h 127.0.0.1 -U postgres -d diskwise_test -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Confirm the device-limit function enforces the limit
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Seed a licence with a limit of one, activate it twice, and assert the second activation
          # raises. This is the atomic-enforcement guarantee, tested against a real Postgres rather
          # than asserted in a comment.
          psql -h 127.0.0.1 -U postgres -d diskwise_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into orders (id, provider_payment_id, product_id, tier_id, amount_minor_units, currency, status, customer_email, environment, paid_at, created_at, updated_at)
          values (gen_random_uuid(), 'pay_ci_1', 'diskwise-pro', 'pro-lifetime', 149900, 'INR', 'succeeded', 'ci@example.com', 'live', 0, 0, 0);

          insert into licences (id, order_id, product_id, tier_id, key_prefix, key_hash, signing_key_id, schema_version, permanent, lease_days, device_limit, issued_at, status, created_at, updated_at)
          values (gen_random_uuid(), (select id from orders where provider_payment_id = 'pay_ci_1'), 'diskwise-pro', 'pro-lifetime', 'AAAAA', 'hash', 'k-test', 1, true, 30, 1, 0, 'active', 0, 0);

          -- The first activation succeeds.
          select activate_device((select id from licences where signing_key_id = 'k-test'), 'dev-aaaaaaaa', 'CI', 'windows', 1);

          -- The second, on a different device, must fail.
          do $$
          begin
            perform activate_device((select id from licences where signing_key_id = 'k-test'), 'dev-bbbbbbbb', 'CI2', 'windows', 2);
            raise exception 'SECOND ACTIVATION SHOULD HAVE BEEN REFUSED';
          exception when check_violation then
            raise notice 'correctly refused the second device';
          end $$;

          -- Re-activating the first device must succeed and consume no extra slot.
          select activate_device((select id from licences where signing_key_id = 'k-test'), 'dev-aaaaaaaa', 'CI', 'windows', 3);
          SQL

      - name: Confirm SECURITY DEFINER RPCs are service-role only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d diskwise_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            total integer;
            restricted integer;
          begin
            select count(*), count(*) filter (where
              not has_function_privilege('anon', p.oid, 'EXECUTE')
              and not has_function_privilege('authenticated', p.oid, 'EXECUTE')
              and has_function_privilege('service_role', p.oid, 'EXECUTE')
              and not exists (
                select 1 from aclexplode(p.proacl) acl
                where acl.grantee = 0 and acl.privilege_type = 'EXECUTE'
              ))
            into total, restricted
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname in (
              'active_device_count', 'activate_device', 'deactivate_device',
              'claim_webhook', 'finish_webhook', 'rate_limit_hit',
              'claim_webhook_v2', 'finish_webhook_v2'
            );
            if total <> 8 or restricted <> 8 then
              raise exception 'RPC privileges unsafe: % functions, % restricted', total, restricted;
            end if;
          end $$;
          SQL

      - name: Confirm webhook claims are retriable and bind the signed body
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d diskwise_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            first_token uuid := gen_random_uuid();
            retry_token uuid := gen_random_uuid();
            stale_token uuid := gen_random_uuid();
            fresh_token uuid := gen_random_uuid();
            first_hash text := repeat('a', 64);
          begin
            if claim_webhook_v2('msg_ci', 'payment.succeeded', first_hash, 1000, first_token) <> 'claimed' then
              raise exception 'first webhook was not claimed';
            end if;
            if claim_webhook_v2('msg_ci', 'payment.succeeded', first_hash, 1001, retry_token) <> 'in-flight' then
              raise exception 'in-flight webhook was claimed twice';
            end if;
            if claim_webhook_v2('msg_ci', 'payment.succeeded', repeat('b', 64), 1002, retry_token) <> 'mismatch' then
              raise exception 'same id with a different body was accepted';
            end if;
            if finish_webhook_v2('msg_ci', retry_token, null, 1003) then
              raise exception 'the wrong worker was allowed to finish';
            end if;
            if not finish_webhook_v2('msg_ci', first_token, 'transient failure', 1004) then
              raise exception 'failure was not recorded';
            end if;
            if claim_webhook_v2('msg_ci', 'payment.succeeded', first_hash, 1005, retry_token) <> 'claimed' then
              raise exception 'failed webhook could not retry';
            end if;
            if finish_webhook_v2('msg_ci', first_token, null, 1006) then
              raise exception 'first worker overwrote the retry';
            end if;
            if not finish_webhook_v2('msg_ci', retry_token, null, 1007) then
              raise exception 'retry could not finish';
            end if;
            if claim_webhook_v2('msg_ci', 'payment.succeeded', first_hash, 1008, gen_random_uuid()) <> 'processed' then
              raise exception 'processed webhook was claimed again';
            end if;
            if claim_webhook_v2('msg_stale', 'refund.succeeded', first_hash, 1000, stale_token) <> 'claimed' then
              raise exception 'second delivery was not claimed';
            end if;
            if claim_webhook_v2('msg_stale', 'refund.succeeded', first_hash, 301001, fresh_token) <> 'claimed' then
              raise exception 'stale lease could not be recovered';
            end if;
            if finish_webhook_v2('msg_stale', stale_token, null, 301002) then
              raise exception 'stale worker was allowed to finish';
            end if;
            if not finish_webhook_v2('msg_stale', fresh_token, null, 301003) then
              raise exception 'fresh worker could not finish';
            end if;
          end $$;
          SQL

      - name: Confirm no client write policy exists
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # With RLS enabled and no policy, a non-service-role statement writes nothing. Assert that
          # the licensing tables really do have RLS on and no permissive policies.
          count=$(psql -h 127.0.0.1 -U postgres -d diskwise_test -tAc \
            "select count(*) from pg_tables t join pg_class c on c.relname = t.tablename
             where t.schemaname = 'public'
               and c.relrowsecurity = false
               and t.tablename in ('orders','licences','device_activations','webhook_events','refunds','revocations','audit_log','recovery_tokens','rate_limits')")
          if [ "$count" != "0" ]; then
            echo "::error::$count licensing tables do not have row level security enabled."
            exit 1
          fi
          policies=$(psql -h 127.0.0.1 -U postgres -d diskwise_test -tAc \
            "select count(*) from pg_policies where schemaname = 'public'")
          if [ "$policies" != "0" ]; then
            echo "::error::$policies client policies exist on the public schema. The licensing tables must have none."
            exit 1
          fi
          echo "RLS is enabled on every licensing table and no client policy exists."

  installers:
    name: Windows installers (MSI + NSIS)
    runs-on: windows-latest
    needs: [frontend, licence, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Bundle MSI and NSIS
        run: npm run app:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: diskwise-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # The installers are deliberately unsigned. Signing is a separate, documented release task;
      # claiming otherwise would be a lie a customer could act on.
      - name: Verify the installers are not code-signed
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem $bundle -Recurse -Include *.msi,*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "NotSigned") {
              Write-Host "::error::$($_.Name) reports a signature status of $($signature.Status). The release process expects unsigned artifacts here."
              exit 1
            }
            Write-Host "$($_.Name): $($_.Length) bytes, $($signature.Status)"
          }
          Write-Host "Installers are unsigned by design. Signing is a separate release task."

  # Build/link only. A real NTFS scan and install/uninstall test remain manual release gates.
  smoke-windows:
    name: Windows link check (no NTFS scan)
    runs-on: windows-latest
    needs: [installers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the app
        run: |
          npm ci
          npm run build
          cd src-tauri
          cargo build --release
      - name: Declare the limit of this check
        shell: pwsh
        run: |
          Write-Host "Compiled and linked on Windows. This job did NOT scan a real NTFS volume"
          Write-Host "or install an MSI/NSIS package; both are manual release blockers."

  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical only)
        run: npm audit --audit-level=high

      - name: Confirm no credential-shaped file is committed
        shell: bash
        run: |
          set -euo pipefail
          # A committed secret is unrecoverable: it must be rotated. Fail loudly rather than warn.
          #
          # The scan covers the code that ships and the backend, and deliberately excludes `.github/`
          # (which contains these very patterns) and the Markdown docs (which describe them). A real
          # secret in either of those would still be caught by the provider's own secret scanning.
          PATHS="src src-tauri supabase scripts *.json *.toml"
          fail=0

          # Provider secrets and the Standard Webhooks prefix.
          if git grep -Iln -e 'whsec_[A-Za-z0-9]\{16,\}' -e 'sk_live_[A-Za-z0-9]\{16,\}' \
                            -e 'eyJhbGciOiJFZERTQSJ9' -- $PATHS ; then
            echo "::error::A provider secret or webhook secret is committed. Rotate it and purge the history."
            fail=1
          fi

          # A PEM private key, detected by its base64 body rather than its header.
          #
          # Matching the bare header string does not work: `supabase/functions/_shared/licence.ts`
          # legitimately contains `-----BEGIN PRIVATE KEY-----` as the wrapper it builds around a
          # runtime key, and a header-only pattern flagged that file on every commit, which is how
          # the `audit` job went red without a secret being involved. Requiring the body is what
          # separates real key material from code that mentions the format.
          #
          # The trade-off, stated plainly: this also flags any standalone base64 blob of 40+
          # characters, including an innocuous one. That is the intended bias — a human looks, and
          # the alternative is a scan that cries wolf and gets ignored.
          if git grep -Iln -E '^[A-Za-z0-9+/]{40,}={0,2}$' -- $PATHS ; then
            echo "::error::A standalone base64 block is committed, which is what a PEM key body looks like. Inspect it; if it is key material, rotate it and purge the history."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "No credential-shaped strings in tracked code."
